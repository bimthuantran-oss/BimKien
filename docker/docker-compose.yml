# Docker Compose cho local dev: chỉ chạy Postgres trong container.
# Next.js dev server chạy trực tiếp trên máy (npm run dev) để hot-reload nhanh.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bimportal
      POSTGRES_PASSWORD: bimportal
      POSTGRES_DB: bimportal
    ports:
      - "5433:5432"
    volumes:
      - pgdata_bimportal:/var/lib/postgresql/data

volumes:
  pgdata_bimportal:
